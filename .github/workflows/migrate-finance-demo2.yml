name: Migrate Finance Demo2 Snapshot

on:
  push:
    paths:
      - '.github/workflows/migrate-finance-demo2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tulshii Finance target
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 1

      - name: Checkout exact Finance Demo2 source snapshot
        uses: actions/checkout@v4
        with:
          repository: pawansiddh/pawansiddh.github.io
          ref: 3cfebc7935a02574f0adf7f9b8b699b64225c86a
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Copy Finance application into standalone repository root
        run: |
          set -euo pipefail
          rsync -a source/finance-demo2/ target/ \
            --exclude '.git' \
            --exclude 'offline-build/'
          cd target
          git config user.name 'pawan kumar'
          git config user.email '131910770+pawansiddh@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Finance snapshot already migrated.'
            exit 0
          fi
          git commit -m 'Migrate Finance Demo2 snapshot into standalone repository'
          git push origin HEAD:main

      - name: Verify core standalone files
        run: |
          set -euo pipefail
          test -f target/index.html
          test -f target/patch-loader-fast-r2.js
          test -f target/finance-ui-controls-r2.js
          test -f target/finance-sidebar-owner-r2.js
          test -f target/finance-offline-sync-r2.js
          test -d target/data
          test -d target/brand-b64
          echo 'Standalone Finance snapshot verification passed.'
