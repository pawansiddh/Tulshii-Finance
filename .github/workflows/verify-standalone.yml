name: Verify Tulshii Finance Standalone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository boundary and required files
        run: |
          set -euo pipefail
          test -f index.html
          test -f patch-loader-fast-r3.js
          test -f patch-loader-fast-r2.js
          test -f finance-ui-controls-r2.js
          test -f finance-sidebar-owner-r3.js
          test -f finance-offline-sync-r3.js
          test -f sw-r3.js
          test -f finance-calendar-studio-r1.js
          test -f finance-coedit-audit-r1.js
          test -d data
          test "$(cat CNAME)" = "finance.tulshii.com"
          grep -q 'TULSHII Finance' index.html
          grep -q 'patch-loader-fast-r3.js' index.html
          grep -q 'tulshii-ii-wrap' finance-sidebar-owner-r3.js
          grep -q 'tulshii-com' finance-sidebar-owner-r3.js
          test ! -d focus
          test ! -d finance-demo2

      - name: Browser smoke test standalone root
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          cat > standalone-smoke.html <<'EOF'
          <!doctype html><html data-result="running"><body>
          <iframe id="app" src="/?standalone-smoke=1" style="width:1365px;height:768px;border:0"></iframe>
          <pre id="out">running</pre>
          <script>
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const waitFor=async(fn,ms=25000)=>{const end=Date.now()+ms;while(Date.now()<end){try{const v=fn();if(v)return v}catch(_){}await sleep(100)}throw Error('timeout')};
          const shown=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0;
          (async()=>{const root=document.documentElement,out=document.getElementById('out'),frame=document.getElementById('app');try{
            const w=await waitFor(()=>frame.contentWindow?.document?.documentElement?.dataset?.pvRuntimeHealth==='ok'?frame.contentWindow:null),d=w.document;
            const req=['.sidebar','.topbar','#pvSide'];for(const s of req)if(!d.querySelector(s))throw Error('missing '+s);
            if(d.documentElement.dataset.tulshiiSidebar!=='r3')throw Error('Tulshii sidebar owner not active');
            if(d.getElementById('pvOfflineSyncStatus'))throw Error('sync cloud control should be hidden');
            const brand=d.querySelector('.sidebar .brand'),full=d.querySelector('.tulshii-brand-full'),mini=d.querySelector('.tulshii-brand-mini'),ii=d.querySelector('.tulshii-ii-wrap svg'),com=d.querySelector('.tulshii-com'),finance=d.querySelector('.tulshii-product');
            if(!brand||!shown(full)||shown(mini)||!ii||!com||!finance)throw Error('expanded Tulshii brand incomplete');
            if(!/TULSH/.test(full.textContent)||com.textContent.trim()!=='.com'||finance.textContent.trim()!=='FINANCE')throw Error('expanded Tulshii brand text incorrect');
            if(/PAWANRO|PAVENRO/i.test(brand.textContent))throw Error('legacy brand visible');
            d.body.classList.add('pv-rail');w.TulshiiSidebar?.refresh();await sleep(120);
            if(shown(d.querySelector('.tulshii-brand-full'))||!shown(d.querySelector('.tulshii-brand-mini'))||!d.querySelector('.tulshii-brand-mini svg'))throw Error('collapsed Tulshii ii mark incorrect');
            d.body.classList.remove('pv-rail');w.TulshiiSidebar?.refresh();await sleep(120);
            if(!shown(d.querySelector('.tulshii-brand-full')))throw Error('expanded brand did not restore');
            const report=w.__PV_BOOT_REPORT__||{};
            root.dataset.result='pass';out.textContent=JSON.stringify({health:d.documentElement.dataset.pvRuntimeHealth,bootMs:d.documentElement.dataset.pvBootMs,tulshiiSidebar:d.documentElement.dataset.tulshiiSidebar,expanded:'TULSH + ii/.com | FINANCE',collapsed:'ii only',failed:report.failed||[]},null,2);
          }catch(e){root.dataset.result='fail';out.textContent=String(e.stack||e)}})();
          </script></body></html>
          EOF
          python3 -m http.server 8765 >/tmp/tulshii-finance-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/standalone-smoke.html >/tmp/tulshii-finance-smoke-out.html
          cat /tmp/tulshii-finance-smoke-out.html
          grep -q 'data-result="pass"' /tmp/tulshii-finance-smoke-out.html
          ! grep -q 'data-result="fail"' /tmp/tulshii-finance-smoke-out.html
